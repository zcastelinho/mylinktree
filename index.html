<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ana Clara | Links</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-black text-white flex items-center justify-center px-6 py-12">

    <!-- Decoração -->
    <div class="background-glow"></div>

    <main class="w-full max-w-md relative z-10">

        <!-- Perfil -->
        <section class="text-center mb-10">

            <div class="profile-circle mx-auto mb-5 flex items-center justify-center">
                <span>AC</span>
            </div>

            <h1 class="font-gothic text-5xl font-semibold tracking-wide">
                Ana Clara
            </h1>

            <p class="mt-3 text-gray-400 text-sm tracking-widest uppercase">
                Análise e Desenvolvimento de Sistemas
            </p>

            <div class="divider mx-auto mt-6"></div>

            <p class="mt-5 text-gray-500 text-sm leading-relaxed">
                Estudante de tecnologia, desenvolvimento e criação digital.
            </p>

        </section>


        <!-- Links -->
        <section class="space-y-4">

            <!-- GitHub -->
            <a
                href="https://github.com/zcastelinho"
                target="_blank"
                class="link-button group"
            >
                <span class="link-icon">⌘</span>

                <span class="flex-1 text-center">
                    GitHub
                </span>

                <span class="arrow group-hover:translate-x-1">
                    →
                </span>
            </a>


            <!-- LinkedIn -->
            <a
                href="https://www.linkedin.com/in/ana-clara-castelo-branco-de-sá-887660350/"
                target="_blank"
                class="link-button group"
            >
                <span class="link-icon">in</span>

                <span class="flex-1 text-center">
                    LinkedIn
                </span>

                <span class="arrow group-hover:translate-x-1">
                    →
                </span>
            </a>


            <!-- Instagram -->
            <a
                href="https://instagram.com/claracastelinhoo"
                target="_blank"
                class="link-button group"
            >
                <span class="link-icon">◎</span>

                <span class="flex-1 text-center">
                    Instagram
                </span>

                <span class="arrow group-hover:translate-x-1">
                    →
                </span>
            </a>


            <!-- Email -->
            <a
                href="mailto:anaclaracastelosa@gmail.com"
                class="link-button group"
            >
                <span class="link-icon">✉</span>

                <span class="flex-1 text-center">
                    E-mail
                </span>

                <span class="arrow group-hover:translate-x-1">
                    →
                </span>
            </a>

        </section>


        <!-- Rodapé -->
        <footer class="text-center mt-12">
            <p class="text-gray-600 text-xs tracking-widest uppercase">
                © 2026 Ana Clara
            </p>
        </footer>

    </main>

</body>
</html>
